# Banco de dados PostgreSQL (credenciais vêm de variáveis de ambiente, .env ou config/application.properties)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/dev_financeiro}
quarkus.datasource.username=${DB_USERNAME:}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=15
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

# CORS para permitir cookies HttpOnly entre Angular (4200) e Quarkus (8080)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200,http://127.0.0.1:4200
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# JWT via HttpOnly Cookie (SmallRye JWT)
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=financeiro-api
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=access_token
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.issuer=financeiro-api
app.auth.cookie-name=access_token
app.auth.cookie-max-age-seconds=86400
app.auth.cookie-secure=false

# Apache Kafka (fila assíncrona para proteger o banco sob picos de requisições)
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.outgoing.transacoes-out.connector=smallrye-kafka
mp.messaging.outgoing.transacoes-out.topic=financeiro-transacoes
mp.messaging.outgoing.transacoes-out.acks=1

mp.messaging.incoming.transacoes-in.connector=smallrye-kafka
mp.messaging.incoming.transacoes-in.topic=financeiro-transacoes
mp.messaging.incoming.transacoes-in.group.id=financeiro-worker
mp.messaging.incoming.transacoes-in.auto.offset.reset=earliest
mp.messaging.incoming.transacoes-in.failure-strategy=ignore

# Perfil de testes automatizados (H2 + conector in-memory sem precisar de Docker)
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:financeiro_test;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.log.sql=false
%test.mp.messaging.outgoing.transacoes-out.connector=smallrye-in-memory
%test.mp.messaging.incoming.transacoes-in.connector=smallrye-in-memory
